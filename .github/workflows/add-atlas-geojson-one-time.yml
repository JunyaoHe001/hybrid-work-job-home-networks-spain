name: Add Spain atlas GeoJSON

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/add-atlas-geojson-one-time.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-geojson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download and verify district geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atlas/data
          URL="https://drive.usercontent.google.com/download?id=1FkXPPajhuuANa36lCQfn1SYJj4VlkV6X&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$URL" --output atlas/data/districts.geojson
          echo "8e186739e1b35a07480130460b6b58224fb1e661636213fceacd47d8af7e8b3f  atlas/data/districts.geojson" | sha256sum --check
          test "$(wc -c < atlas/data/districts.geojson)" -gt 5000000

      - name: Allow the published GeoJSON on gh-pages only
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qxF '!atlas/data/districts.geojson' .gitignore; then
            printf '\n# Public interactive atlas asset\n!atlas/data/districts.geojson\n' >> .gitignore
          fi

      - name: Commit missing atlas geometry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore
          git add -f atlas/data/districts.geojson
          git commit -m "Publish Spain atlas district geometry"
          git push origin HEAD:gh-pages
